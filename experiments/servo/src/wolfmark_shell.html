<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src 'none'; connect-src 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
<title>Wolfmark — {{TITLE}}</title>
<style>{{CSS}}</style>
</head>
<body>
<div class="shell">
  <header class="titlebar">
    <div class="brand"><img src="{{LOGO}}" width="28" height="28" alt=""><b>Wolfmark</b></div>
    <span class="separator"></span>
    <span class="sidebar-indicator" title="Navigation sidebar">◧</span>
    <span class="breadcrumb">Documents <span class="crumb-arrow">›</span> <strong>{{TITLE}}</strong></span>
    <span class="header-space"></span>
    <span class="search-placeholder" title="Document search is not implemented in this prototype">⌕&nbsp; Search in document… <kbd>Ctrl+F</kbd></span>
    <span class="settings-placeholder" title="Settings are not implemented in this prototype">⚙ &nbsp;Settings</span>
    <span class="window-chrome-note" title="Native window chrome is still a future Servo task">Prototype</span>
  </header>
  <aside class="sidebar">
    <a class="open-button" href="wolfmark://action/open"><span class="open-icon">▱</span><strong>Open document</strong></a>
    <div class="sidebar-label">OPEN DOCUMENTS</div>
    <nav class="documents">{{DOCS}}</nav>
    <div class="sidebar-label outline-label">OUTLINE</div>
    <nav class="outline">{{OUTLINE}}</nav>
    <footer class="sidebar-footer" style="--brand-banner:url('{{BANNER}}')">
      <div class="footer-gradient"></div>
      <div class="footer-brand"><img src="{{LOGO}}" width="42" height="42" alt=""><div><b>Wolfmark</b><small>Servo UI prototype</small></div></div>
    </footer>
  </aside>
  <section class="workspace">
    <div class="toolbar">
      <span class="nav-arrows" title="Document navigation history is not yet implemented">‹ &nbsp; ›</span>
      <nav class="modes">
        <a href="wolfmark://action/mode/reader" class="mode{{READER_ACTIVE}}">▣ &nbsp;Reader</a>
        <span class="mode disabled" title="Live Preview editing is not yet implemented">▤ &nbsp;Live Preview</span>
        <a href="wolfmark://action/mode/source" class="mode{{SOURCE_ACTIVE}}">⌘ &nbsp;Source</a>
      </nav>
      <div class="toolbar-space"></div>
      <nav class="zoom"><a href="wolfmark://action/zoom/out" title="Zoom out">−</a><a href="wolfmark://action/zoom/reset" title="Reset zoom" class="zoom-value">{{ZOOM}}%</a><a href="wolfmark://action/zoom/in" title="Zoom in">+</a></nav>
      <span class="toolbar-divider"></span>
      <a class="refresh" href="wolfmark://action/refresh" title="Reload document from disk">↻</a>
      <span class="toolbar-more" title="Further document tools are not yet implemented">⋯</span>
    </div>
    <div class="reader-scroll">
      <article class="document" style="--zoom:{{SCALE}}"><div class="file-kind">{{SOURCE_TYPE}}</div>{{MESSAGE}}{{CONTENT}}</article>
    </div>
  </section>
</div>
</body>
</html>
