[build]
target-dir = "out/cargo"

[alias]
# The isolated Servo experiment is opt-in. Bare cargo run/build always keep Qt.
servo-test = ["run", "--manifest-path", "experiments/servo/Cargo.toml", "--target-dir", "out/servo-cargo"]
build-servo-test = ["build", "--manifest-path", "experiments/servo/Cargo.toml", "--target-dir", "out/servo-cargo"]
check-servo-test = ["check", "--manifest-path", "experiments/servo/Cargo.toml", "--target-dir", "out/servo-cargo"]
app = "run --release"
build-app = "build --release"
setup = ["run", "--quiet", "--manifest-path", "scripts/cargo_alias/Cargo.toml", "--target-dir", "out/cargo-alias", "--", "setup"]
all = ["run", "--quiet", "--manifest-path", "scripts/cargo_alias/Cargo.toml", "--target-dir", "out/cargo-alias", "--", "all"]
package-app = ["run", "--quiet", "--manifest-path", "scripts/cargo_alias/Cargo.toml", "--target-dir", "out/cargo-alias", "--", "package"]
clean-app = ["run", "--quiet", "--manifest-path", "scripts/cargo_alias/Cargo.toml", "--target-dir", "out/cargo-alias", "--", "clean"]
deep-clean = ["run", "--quiet", "--manifest-path", "scripts/cargo_alias/Cargo.toml", "--target-dir", "out/cargo-alias", "--", "deep-clean"]
