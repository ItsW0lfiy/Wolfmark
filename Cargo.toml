[package]
name = "wolfmark"
version = "0.1.0-dev.7"
edition = "2024"
rust-version = "1.94"
build = "build.rs"
default-run = "wolfmark"
description = "Native Markdown viewer built with Rust, C++20, Qt 6 Widgets, and QTextDocument"
license = "GPL-3.0-only"
authors = ["ItsW0lfiy"]

[dependencies]
comrak = { version = "0.54.0", default-features = false }
crossbeam-channel = "0.5.15"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2.3.2"
rayon = "1.11.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
sha2 = "0.10.9"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-onig"] }
url = "2.5.7"

[build-dependencies]
cc = "1.2.38"
pkg-config = "0.3.32"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
