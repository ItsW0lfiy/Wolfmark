name: Servo migration — synchronize Cargo lockfile

on:
  push:
    branches:
      - codex/servo-migration-20261029
    paths:
      - ".github/workflows/servo-lock-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-lockfile:
    name: Resolve exact Servo migration dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Update only lockfile resolution
        run: |
          cargo metadata --manifest-path experiments/servo/Cargo.toml --format-version 1 > /dev/null
          git diff --stat -- experiments/servo/Cargo.lock
      - name: Commit updated lockfile to migration branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- experiments/servo/Cargo.lock; then
            echo 'Servo Cargo.lock is already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/servo/Cargo.lock
          git commit -m "build(servo): synchronize lockfile after platform dependency integration [skip ci]"
          git push origin HEAD:refs/heads/codex/servo-migration-20261029
