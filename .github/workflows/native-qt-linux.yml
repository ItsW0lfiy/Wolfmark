name: Wolfmark native Qt — Linux verification

on:
  push:
    branches: [main]
    paths:
      - "native/qt/**"
      - "packaging/windows/setup-ui/**"
      - "assets/branding/**"
      - "src/**"
      - "build.rs"
      - "fixtures/crimson-graphite-visual-reference.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-qt-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    name: Export verified source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive source checkout
        run: tar -czf "$RUNNER_TEMP/wolfmark-source-snapshot.tar.gz" --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: wolfmark-source-snapshot
          path: ${{ runner.temp }}/wolfmark-source-snapshot.tar.gz
          retention-days: 7
  native-qt:
    name: Rust and Qt build / UI smoke
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native Qt dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git g++ pkg-config qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins libgl1-mesa-dev fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - name: Check application
        run: cargo check -p wolfmark --locked
      - name: Test Rust application
        run: cargo test -p wolfmark --locked
      - name: Link native Qt desktop application
        run: cargo build -p wolfmark --locked
      - name: Test Markdown render and capture Reader UI
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
          WOLFMARK_SNAPSHOT_NAME: "crimson-graphite"
        run: |
          timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md --smoke-render
          timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md --smoke-snapshot
      - name: Capture sidebar-only multi-document navigation and code styling
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
          WOLFMARK_SNAPSHOT_NAME: "crimson-graphite-multidoc"
        run: timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md fixtures/code-block-quality.md --smoke-snapshot
      - name: Capture selected Live Preview styling
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
          WOLFMARK_SNAPSHOT_MODE: live
          WOLFMARK_SNAPSHOT_NAME: crimson-graphite-live
        run: timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md --smoke-snapshot
      - name: Capture approved-concept comparison at matching viewport dimensions
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
          WOLFMARK_SNAPSHOT_WIDTH: "1648"
          WOLFMARK_SNAPSHOT_HEIGHT: "928"
          WOLFMARK_SNAPSHOT_NAME: crimson-graphite-reference-comparison
        run: timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md fixtures/crimson-graphite-visual-reference.md --smoke-snapshot
      - name: Verify rounded tables and nested quote surfaces
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: |
          timeout 45s ./out/cargo/debug/wolfmark fixtures/table-corner-quality.md --smoke-style
          timeout 45s ./out/cargo/debug/wolfmark fixtures/table-corner-quality.md --smoke-zoom
          for percent in 100 150; do
            WOLFMARK_SNAPSHOT_WIDTH=1648 WOLFMARK_SNAPSHOT_HEIGHT=928 \
            WOLFMARK_SNAPSHOT_ZOOM="$percent" \
            WOLFMARK_SNAPSHOT_NAME="table-corners-$percent" \
              timeout 45s ./out/cargo/debug/wolfmark fixtures/table-corner-quality.md --smoke-snapshot
          done
      - name: Verify rounded inline code and native selection at two zoom levels
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: |
          timeout 45s ./out/cargo/debug/wolfmark fixtures/inline-code-quality.md --smoke-style
          for percent in 100 150; do
            WOLFMARK_SNAPSHOT_WIDTH=1648 WOLFMARK_SNAPSHOT_HEIGHT=928 \
            WOLFMARK_SNAPSHOT_ZOOM="$percent" \
            WOLFMARK_SNAPSHOT_NAME="inline-code-rounded-$percent" \
              timeout 45s ./out/cargo/debug/wolfmark fixtures/inline-code-quality.md --smoke-snapshot
          done
      - name: Verify smooth wheel motion and direct anchor navigation
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: timeout 60s ./out/cargo/debug/wolfmark fixtures/navigation-motion.md --smoke-motion
      - name: Capture Settings UI
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: timeout 45s ./out/cargo/debug/wolfmark --smoke-settings-ui
      - name: Exercise Crimson Graphite mode and Find controls
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md --smoke-shell-controls
      - name: Verify actual multi-document navigation and controls
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: timeout 45s ./out/cargo/debug/wolfmark fixtures/wolfmark-visual-test.md fixtures/code-block-quality.md --smoke-shell-controls
      - name: Verify reader styling, copy and scroll stability
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: |
          timeout 45s ./out/cargo/debug/wolfmark fixtures/document-tables.md --smoke-style
          timeout 45s ./out/cargo/debug/wolfmark fixtures/layout-transitions.md --smoke-scroll-stability
      - name: Capture Settings editor and About pages
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFMARK_DISABLE_UPDATE_CHECKS: "1"
        run: |
          WOLFMARK_SNAPSHOT_SETTINGS_PAGE=editor timeout 45s ./out/cargo/debug/wolfmark --smoke-settings-ui
          WOLFMARK_SNAPSHOT_SETTINGS_PAGE=about timeout 45s ./out/cargo/debug/wolfmark --smoke-settings-ui
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolfmark-native-ui
          path: out/visual/dev7/*.png
          if-no-files-found: warn

  windows-installer-ui:
    name: Windows NSIS setup host — compile and capture
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64
          modules: ''
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile Windows Rust and native Qt application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WOLFMARK_QT_DIR = $env:QT_ROOT_DIR
          cargo check --locked -p wolfmark
          if ($LASTEXITCODE -ne 0) { throw "Wolfmark Windows application compilation failed." }
      - name: Build and exercise the native Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WOLFMARK_QT_DIR = $env:QT_ROOT_DIR
          $env:WOLFMARK_DISABLE_UPDATE_CHECKS = '1'
          cargo build --locked -p wolfmark
          if ($LASTEXITCODE -ne 0) { throw 'Wolfmark Windows application link failed.' }
          $app = Join-Path $PWD.Path 'out/cargo/debug/wolfmark.exe'
          if (!(Test-Path $app)) { throw 'Linked Windows application was not found.' }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Wolfmark Qt runtime deployment failed.' }

          # Run the same native integration suite as cargo all, not just a
          # hand-picked subset of Windows smoke tests.
          cargo test --locked -p wolfmark --test native_frontend -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows native frontend integration suite failed.' }

          # Windows must exercise the actual application, not only compile it.
          # Each smoke mode exits on its own; the timeout catches GUI deadlocks.
          $runSmoke = {
            param([string[]] $arguments)
            $process = Start-Process -FilePath $app -WorkingDirectory $PWD.Path `
              -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(45000)) {
              $process.Kill()
              throw "Windows Wolfmark smoke timed out: $($arguments -join ' ')"
            }
            if ($process.ExitCode -ne 0) {
              throw "Windows Wolfmark smoke failed ($($process.ExitCode)): $($arguments -join ' ')"
            }
          }
          & $runSmoke -arguments @('fixtures/wolfmark-visual-test.md', '--smoke-render')
          & $runSmoke -arguments @('fixtures/wolfmark-visual-test.md',
            'fixtures/crimson-graphite-visual-reference.md', '--smoke-shell-controls')
          & $runSmoke -arguments @('fixtures/table-corner-quality.md', '--smoke-style')
          & $runSmoke -arguments @('fixtures/inline-code-quality.md', '--smoke-style')

          # The Windows integration suite checks six outline/image reflow cases.
          # Keep them in CI too: Linux Rust tests cannot execute the Windows-only
          # native_frontend.rs cases, so green Linux builds alone miss this race.
          foreach ($fixture in @(
            'outline-reflow-single.md', 'outline-reflow-multiple.md',
            'outline-reflow-missing.md', 'outline-reflow-failed.md',
            'outline-reflow-bottom.md', 'outline-reflow-rapid.md'
          )) {
            Write-Host "Native outline/reflow verification: $fixture"
            & $runSmoke -arguments @("fixtures/$fixture", '--smoke-outline-reflow')
          }

          $env:WOLFMARK_SNAPSHOT_WIDTH = '1648'
          $env:WOLFMARK_SNAPSHOT_HEIGHT = '928'
          foreach ($mode in @('reader', 'live')) {
            $env:WOLFMARK_SNAPSHOT_MODE = if ($mode -eq 'live') { 'live' } else { '' }
            $env:WOLFMARK_SNAPSHOT_NAME = "crimson-graphite-windows-$mode"
            & $runSmoke -arguments @('fixtures/wolfmark-visual-test.md',
              'fixtures/crimson-graphite-visual-reference.md', '--smoke-snapshot')
            $image = Join-Path $PWD.Path "out/visual/dev7/$env:WOLFMARK_SNAPSHOT_NAME.png"
            if (!(Test-Path $image)) { throw "Windows $mode UI screenshot was not created." }
            Add-Type -AssemblyName System.Drawing
            $bitmap = [System.Drawing.Image]::FromFile($image)
            try { Write-Host "Windows $mode screenshot: $($bitmap.Width)x$($bitmap.Height)" }
            finally { $bitmap.Dispose() }
          }

          # GitHub's virtual Windows display can clamp native windows to
          # 1044x788. Capture an additional Windows-font/layout reference at
          # the approved 1648x928 using Qt's offscreen platform, while retaining
          # the actual native-window screenshots above for interaction review.
          $offscreenPlugin = Join-Path $env:QT_ROOT_DIR 'plugins/platforms/qoffscreen.dll'
          if (!(Test-Path $offscreenPlugin)) { throw 'Qt Windows offscreen plugin is missing.' }
          Copy-Item $offscreenPlugin 'out/cargo/debug/platforms/qoffscreen.dll' -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          # Qt's Windows offscreen plugin has no native font database.
          # Supply the runner's installed system fonts instead of tofu glyphs.
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR 'Fonts'
          try {
            foreach ($mode in @('reader', 'live')) {
              $env:WOLFMARK_SNAPSHOT_MODE = if ($mode -eq 'live') { 'live' } else { '' }
              $env:WOLFMARK_SNAPSHOT_NAME = "crimson-graphite-windows-offscreen-$mode"
              & $runSmoke -arguments @('fixtures/wolfmark-visual-test.md',
                'fixtures/crimson-graphite-visual-reference.md', '--smoke-snapshot')
              $image = Join-Path $PWD.Path "out/visual/dev7/$env:WOLFMARK_SNAPSHOT_NAME.png"
              if (!(Test-Path $image)) { throw "Windows offscreen $mode screenshot is missing." }
              $bitmap = [System.Drawing.Image]::FromFile($image)
              try {
                Write-Host "Windows offscreen ${mode}: $($bitmap.Width)x$($bitmap.Height)"
                if ($bitmap.Width -ne 1648 -or $bitmap.Height -ne 928) {
                  throw 'Windows offscreen reference did not preserve the approved viewport.'
                }
              }
              finally { $bitmap.Dispose() }
            }
            # Windows font metrics differ from Linux. Verify the 150% inline
            # code pill corners in the same exact-size offscreen viewport.
            $env:WOLFMARK_SNAPSHOT_MODE = ''
            $env:WOLFMARK_SNAPSHOT_ZOOM = '150'
            $env:WOLFMARK_SNAPSHOT_NAME = 'inline-code-windows-offscreen-150'
            & $runSmoke -arguments @('fixtures/inline-code-quality.md', '--smoke-snapshot')
            $image = Join-Path $PWD.Path "out/visual/dev7/$env:WOLFMARK_SNAPSHOT_NAME.png"
            if (!(Test-Path $image)) { throw 'Windows inline-code snapshot is missing.' }
            $bitmap = [System.Drawing.Image]::FromFile($image)
            try {
              if ($bitmap.Width -ne 1648 -or $bitmap.Height -ne 928) {
                throw 'Windows inline-code snapshot has the wrong dimensions.'
              }
            }
            finally { $bitmap.Dispose() }
          }
          finally {
            Remove-Item Env:WOLFMARK_SNAPSHOT_ZOOM -ErrorAction SilentlyContinue
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            Remove-Item Env:QT_QPA_FONTDIR -ErrorAction SilentlyContinue
          }
      - name: Upload native Windows application UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolfmark-windows-app-ui
          path: |
            out/visual/dev7/crimson-graphite-windows-*.png
            out/visual/dev7/inline-code-windows-offscreen-150.png
          if-no-files-found: warn
      - name: Compile native C++ setup host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD.Path
          $out = Join-Path $root 'out/setup-qa'
          New-Item -ItemType Directory -Force -Path "$out/generated", "$out/bin", "$out/obj" | Out-Null
          @('#define WOLFMARK_SETUP_VERSION_COMMAS 0,1,0,7', '#define WOLFMARK_SETUP_VERSION_STRING "0.1.0-dev.7"') |
            Set-Content "$out/generated/wolfmark_setup_version.h" -Encoding ascii
          $project = Join-Path $root 'packaging/windows/setup-ui/WolfmarkSetup.vcxproj'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'Visual Studio discovery tool is missing.' }
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' |
            Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild was not found on the Windows runner.' }
          & "$msbuild" $project '/t:Build' '/p:Configuration=Release' '/p:Platform=x64' `
            "/p:QtRoot=$env:QT_ROOT_DIR" "/p:ProjectRoot=$root" "/p:WolfmarkGeneratedDir=$out/generated" `
            "/p:WolfmarkOutputDir=$out/bin" "/p:WolfmarkIntermediateDir=$out/obj" `
            '/m:1' '/nr:false' '/v:minimal'
          if ($LASTEXITCODE -ne 0) { throw 'Native setup host build failed.' }
      - name: Run non-elevated setup UI screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $PWD.Path 'out/setup-qa/bin/WolfmarkSetup.exe'
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --no-translations "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Qt runtime deployment failed.' }
          New-Item -Force -ItemType Directory 'out/setup-qa/bin/assets/branding' | Out-Null
          Copy-Item 'assets/branding/wolfmark-symbol.png' 'out/setup-qa/bin/assets/branding/'
          foreach ($screen in @('install','maintenance','update','repair','progress','complete','error')) {
            $image = Join-Path $PWD.Path "out/setup-qa/$screen.png"
            $startupLog = Join-Path $PWD.Path "out/setup-qa/bootstrap-$screen.log"
            # GUI-subsystem executables can return control before they finish
            # when invoked directly from pwsh. Explicitly wait for QTimer capture.
            $process = Start-Process -FilePath $app -ArgumentList @(
              "--bootstrap-log=$startupLog", "--ui-smoke=$screen", "--ui-screenshot=$image"
            ) -PassThru -Wait
            $code = $process.ExitCode
            Write-Host "Setup UI state=$screen exit=$code screenshot=$([bool](Test-Path $image))"
            if (Test-Path $startupLog) {
              Get-Content $startupLog | Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
            }
            if ($code -ne 0 -or !(Test-Path $image)) { throw "Setup UI $screen failed (exit $code)" }
          }
      - name: Upload native Windows setup UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolfmark-windows-setup-ui
          path: |
            out/setup-qa/*.png
            out/setup-qa/bootstrap-*.log
          if-no-files-found: warn
